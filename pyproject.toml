[project]
name = "dots_esdl_decorator"
version = "0.1.0"
description = "ESDL decorator CLI to add weather, markets and assets to an ESDL file"
authors = [ { name = "Leo van Schooten", email = "l.g.t.v.schooten@tue.nl" } ]
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE"
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.3",
    "pyESDL==26.5",
]

[project.urls]
"Homepage" = "https://github.com/dots-energy/scenario-decorator/"
"Issues" = "https://github.com/dots-energy/scenario-decorator/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
dots-esdl-decorator = "dots_esdl_decorator.esdl_decorator:main"